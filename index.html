<!doctype html>
<html lang="fr"><head>
<title>Casa de Noah</title>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#FFF8EC"><meta name="description" content="Jeu éducatif pour enfants de 5 ans : 8 univers, pièces à gagner et 151 cartes d’animaux à collectionner.">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Andika:wght@400;700&display=swap">
<style>
html{-webkit-text-size-adjust:100%}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

/* Layout: one-screen explorer app — sticky profile/chest header, illustrated nature scenes, five coloured "univers" tiles, white question bubbles over scenes. Single bright storybook look (light only). */
:root{
  --cream:#FFF8EC; --paper:#FFFFFF; --ink:#2B2A3D; --ink-soft:#5E5A72; --line:#EADCC4;
  --wood:#9A5B2C; --wood-dk:#6B3A17; --wood-lt:#C8874A;
  --green:#3FA34D; --green-dk:#2A7A35; --orange:#F5A623; --orange-dk:#C97D0A;
  --blue:#2E8FE0; --blue-dk:#1C68AE; --purple:#8E5CE6; --purple-dk:#6338B5; --red:#E5484D; --red-dk:#B12A2F;
  --gold:#FFC93C; --gold-dk:#E09A00;
  --f-display:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Andika","Comic Sans MS","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--cream);color:var(--ink);font-family:var(--f-body);font-size:17px;display:flex;flex-direction:column;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--cream)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
.u-green{--u:var(--green);--ud:var(--green-dk);--ul:#E4F5E3}
.u-orange{--u:var(--orange);--ud:var(--orange-dk);--ul:#FFF1D6}
.u-blue{--u:var(--blue);--ud:var(--blue-dk);--ul:#DFF0FD}
.u-purple{--u:var(--purple);--ud:var(--purple-dk);--ul:#EEE6FD}
.u-red{--u:var(--red);--ud:var(--red-dk);--ul:#FDE4E5}
.u-teal{--u:#16A3A0;--ud:#0E7774;--ul:#DDF5F4}
.u-pink{--u:#E8618C;--ud:#B23A63;--ul:#FDE6EE}
.u-es{--u:#E0A21A;--ud:#A86F00;--ul:#FFF2CC}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--cream);padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.profile{display:flex;align-items:center;min-width:0}
.ava{width:52px;height:52px;border-radius:16px;background:#FFE7B8;border:4px solid #fff;box-shadow:0 3px 0 var(--wood-dk),0 0 0 2px var(--wood);display:grid;place-items:center;font-size:30px;position:relative;z-index:1;flex:none}
.plate{margin-left:-8px;padding:4px 14px 4px 16px;border-radius:0 12px 12px 0;background:linear-gradient(var(--wood-lt),var(--wood));color:#fff;box-shadow:0 3px 0 var(--wood-dk);text-align:left;min-width:0}
.plate b{display:block;font-family:var(--f-display);font-size:19px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw;text-shadow:0 1px 0 var(--wood-dk)}
.plate small{font-family:var(--f-display);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.plate .st{color:var(--gold)}
.tr{display:flex;align-items:center;gap:8px}
.chest{display:flex;align-items:center;gap:6px;background:#FFF4CF;border:3px solid var(--gold);border-radius:18px;padding:3px 12px 3px 6px}
.chest svg{width:40px;height:36px}
.chest b{font-family:var(--f-display);font-size:23px;font-variant-numeric:tabular-nums;min-width:2ch;text-align:right;color:#8A5A00}
.chest.bump{animation:bump .35s}
@keyframes bump{50%{transform:scale(1.15) rotate(-4deg)}}
.gear{width:44px;height:44px;border-radius:50%;background:#2F8E8A;color:#fff;display:grid;place-items:center;box-shadow:0 3px 0 #1F6461}
.gear svg{width:24px;height:24px}
main{flex:1;overflow-y:auto;padding-block:6px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2{font-family:var(--f-display);margin:0;text-wrap:balance}

/* Hero */
.hero{position:relative;border-radius:26px;overflow:hidden;height:250px;border:4px solid #fff;box-shadow:0 8px 20px rgba(60,40,10,.18)}
.hero>svg,.scene>svg.bg{position:absolute;inset:0;width:100%;height:100%}
.hero-pal{position:absolute;left:14px;bottom:10px;font-size:76px;filter:drop-shadow(0 4px 2px rgba(0,0,0,.25))}
.sign{position:absolute;right:12px;top:18px;width:min(60%,300px);display:flex;flex-direction:column;align-items:center}
.board-w{position:relative;z-index:1;width:100%;border-radius:14px;padding:12px 12px 14px;text-align:center;color:#fff;background:repeating-linear-gradient(0deg,rgba(0,0,0,.07) 0 2px,transparent 2px 13px),linear-gradient(var(--wood-lt),var(--wood));border:3px solid var(--wood-dk);box-shadow:0 5px 0 var(--wood-dk)}
.board-w h1{font-size:clamp(19px,5.4vw,27px);line-height:1.05;text-transform:uppercase;letter-spacing:.02em;text-shadow:0 2px 0 var(--wood-dk)}
.board-w p{margin:6px 0 10px;font-size:14px;line-height:1.3}
.play{width:62px;height:62px;border-radius:50%;background:var(--green);border:4px solid #fff;box-shadow:0 4px 0 var(--green-dk);display:inline-grid;place-items:center;animation:pulse 2s ease-in-out infinite}
.play svg{width:28px;height:28px;margin-left:4px}
@keyframes pulse{50%{transform:scale(1.08)}}
.sign .post{position:absolute;bottom:-40px;width:10px;height:60px;background:var(--wood-dk);border-radius:3px}
.sign .post.l{left:24%}.sign .post.r{right:24%}

/* Univers tiles */
.univers{display:grid;grid-template-columns:repeat(12,1fr);gap:10px;background:#fff;border-radius:24px;padding:10px;box-shadow:0 4px 0 var(--line)}
.utile{grid-column:span 3;min-width:0;border-radius:20px;background:linear-gradient(180deg,color-mix(in srgb,var(--u) 78%,#fff),var(--u));border:3px solid #fff;box-shadow:0 5px 0 var(--ud),0 0 0 2px var(--ud);color:#fff;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px 10px;transition:transform .1s}

.utile:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ud),0 0 0 2px var(--ud)}
.uic svg{width:46px;height:46px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.18))}
.ul{font-family:var(--f-display);font-weight:600;font-size:15px;line-height:1.1;text-align:center;text-shadow:0 1px 0 rgba(0,0,0,.2)}
.ulv{font-size:11px;font-weight:700;opacity:.95}

/* Mission + row */
.mission{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;background:#EAF7E4;border:3px solid #BFE3B4;border-radius:22px;padding:12px}
.mi-ic{width:52px;height:52px;border-radius:16px;background:var(--u);display:grid;place-items:center}
.mi-ic svg{width:36px;height:36px}
.mi-txt{min-width:0;display:flex;flex-direction:column;gap:4px}
.mi-txt b{font-family:var(--f-display);font-size:19px;color:var(--green-dk)}
.mi-txt span{font-size:14px;line-height:1.35}
.mbar{height:10px;border-radius:99px;background:#fff;overflow:hidden}
.mbar i{display:block;height:100%;background:var(--green);border-radius:99px}
.mi-n{font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--green-dk);font-variant-numeric:tabular-nums}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.wide{border-radius:20px;padding:12px 8px;background:var(--paper);border:3px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 4px 0 var(--line)}
.wide .wl{font-family:var(--f-display);font-size:19px;font-weight:600;text-align:center;line-height:1.15}
.wide small{font-size:13px;color:var(--ink-soft)}
.shopb{border-color:var(--gold);background:#FFF8E1;box-shadow:0 4px 0 var(--gold-dk)}
.albumb{border-color:#E5C79A;background:#FBF1E1;box-shadow:0 4px 0 var(--wood-lt)}

/* Game */
.gbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.back{font-family:var(--f-display);font-size:17px;font-weight:600;background:var(--paper);border:3px solid var(--line);border-radius:14px;padding:6px 12px}
.gtitle{flex:1;min-width:0;display:flex;flex-direction:column}
.gtitle b{font-family:var(--f-display);font-size:21px;color:var(--ud);line-height:1.1}
.gtitle span{font-size:13px;font-weight:700;color:var(--ink-soft)}
.casse{display:flex;gap:4px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:3px}
.casse button{font-family:var(--f-display);font-size:18px;font-weight:700;border-radius:10px;padding:2px 12px;color:var(--ink-soft)}
.casse button.on{background:var(--u);color:#fff}
.scene{position:relative;border-radius:26px;overflow:hidden;border:4px solid #fff;box-shadow:0 8px 20px rgba(60,40,10,.18);min-height:440px}
.content{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:14px;padding:14px 12px 18px}
.bubble{align-self:stretch;display:flex;align-items:center;gap:10px;background:#fff;border-radius:20px;padding:8px 14px 8px 8px;box-shadow:0 4px 0 rgba(0,0,0,.12);font-family:var(--f-display);font-size:21px;font-weight:600;line-height:1.25}
.bubble b{color:var(--ud)}
.spk{flex:none;width:48px;height:48px;border-radius:50%;background:var(--u);color:#fff;display:grid;place-items:center;box-shadow:0 3px 0 var(--ud)}
.spk svg{width:26px;height:26px}
.qbody{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
.card-w{background:rgba(255,255,255,.94);border-radius:20px;padding:10px 14px;box-shadow:0 4px 0 rgba(0,0,0,.1);display:flex;flex-direction:column;align-items:center;gap:6px;max-width:100%}
.item .ie{font-size:76px;line-height:1.1}
.item b{font-family:var(--f-display);font-size:22px}
.choices{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;width:100%}
.ch{min-width:84px;min-height:84px;border-radius:20px;background:#fff;border:4px solid #fff;outline:3px solid var(--ul);font-family:var(--f-display);font-size:40px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 10px;box-shadow:0 5px 0 rgba(0,0,0,.18);transition:transform .1s}
.ch:active{transform:translateY(3px)}
.ch.pic{font-size:50px;min-width:100px}
.ch.pic small{font-family:var(--f-body);font-size:15px;font-weight:700;color:var(--ink-soft)}
.ch svg{width:64px;height:64px}
.ch.good{background:#DDF7E8;outline-color:var(--green);animation:pop .4s}
.ch.bad{background:#FDE6EC;outline-color:var(--red);opacity:.55;box-shadow:none;animation:shake .4s}
@keyframes pop{50%{transform:scale(1.15)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.grapheme{font-family:var(--f-display);font-size:62px;font-weight:700;color:var(--ud);background:#fff;border-radius:20px;padding:0 26px;line-height:1.35;box-shadow:0 4px 0 rgba(0,0,0,.1)}
.hidew{font-family:var(--f-display);font-size:34px;font-weight:700;letter-spacing:.08em}
.hidew u{text-decoration:none;color:var(--u);border-bottom:4px solid var(--u)}
.model{font-family:var(--f-display);font-size:32px;font-weight:700;letter-spacing:.18em;color:var(--ud)}
.slots,.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.slots .sl{width:44px;height:52px;border-radius:12px;background:#fff;border:3px dashed var(--u);display:grid;place-items:center;font-family:var(--f-display);font-size:30px;font-weight:700}
.slots .sl.on{border-style:solid;background:var(--ul)}
.tiles button{width:54px;height:58px;border-radius:14px;background:#FFF6E5;border:3px solid #F0C98A;box-shadow:0 4px 0 #D9A85A;font-family:var(--f-display);font-size:32px;font-weight:700;color:#C2410C}
.tiles button.used{visibility:hidden}
.tiles button.bad{animation:shake .4s;background:#FDE6EC}
.dots{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:4px;font-size:30px;line-height:1.1}
.basket{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:330px}
.slot{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:28px}
.slot.full{background:var(--ul)}
.slot.empty{border:3px dashed var(--u)}
.fade{opacity:.25;position:relative}
.eq{font-family:var(--f-display);font-size:32px;font-weight:600;font-variant-numeric:tabular-nums}
.eq .q{display:inline-grid;place-items:center;width:48px;height:48px;border-radius:12px;background:#FFF4CF;border:3px solid var(--gold);color:#8A5A00}
.nseq{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.nseq span{width:52px;height:56px;border-radius:14px;background:#fff;display:grid;place-items:center;font-family:var(--f-display);font-size:28px;font-weight:700;border:3px solid var(--ul);font-variant-numeric:tabular-nums}
.nseq span.q{background:#FFF4CF;border-color:var(--gold);color:#8A5A00}
.grp{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;font-size:28px;max-width:150px}
.ch.grpb{min-height:120px;min-width:130px}
.plus{font-family:var(--f-display);font-size:36px;font-weight:700;color:var(--ud)}
.prow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}
.hole{width:120px;height:120px}
.fseq{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-items:center}
.fseq svg{width:42px;height:42px}
.fseq .q{width:42px;height:42px;border-radius:10px;border:3px dashed var(--u);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;color:var(--ud);font-size:24px}
/* Map mission */
.board{position:relative;width:min(80vw,330px);aspect-ratio:1;max-width:100%;background:rgba(255,255,255,.55);border-radius:16px;padding:4px}
.cells{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:4px;width:100%;height:100%}
.cell{background:#BFE6A6;border-radius:10px;display:grid;place-items:center;font-size:calc(min(80vw,330px)/var(--n)*.55);box-shadow:inset 0 -3px 0 rgba(0,0,0,.08)}
.cell.goal{background:#FFE9A8}
.robot{position:absolute;left:4px;top:4px;width:calc((100% - 8px)/var(--n));height:calc((100% - 8px)/var(--n));display:grid;place-items:center;font-size:calc(min(80vw,330px)/var(--n)*.62);transition:transform .35s ease;pointer-events:none}
.robot.bonk{animation:shake .4s}
.progline{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:44px;align-items:center;background:rgba(255,255,255,.94);border-radius:14px;padding:6px 10px;width:100%;max-width:340px}
.progline .ar{width:34px;height:34px;border-radius:10px;background:var(--u);color:#fff;display:grid;place-items:center}
.progline .ar.now{background:var(--gold);color:var(--ink)}
.progline .ph{color:var(--ink-soft);font-size:14px}
.ar svg,.pad svg{width:60%;height:60%}
.pad{display:grid;grid-template-columns:repeat(3,62px);grid-template-rows:repeat(2,62px);gap:8px;justify-content:center}
.pad button{border-radius:18px;background:var(--u);color:#fff;display:grid;place-items:center;box-shadow:0 5px 0 var(--ud);border:3px solid #fff}
.pad button:disabled,.runrow button:disabled{opacity:.45}
.pad .up{grid-column:2;grid-row:1}.pad .left{grid-column:1;grid-row:2}.pad .down{grid-column:2;grid-row:2}.pad .right{grid-column:3;grid-row:2}
.runrow{display:flex;gap:12px}
.go{font-family:var(--f-display);font-size:24px;font-weight:700;background:var(--gold);color:var(--ink);border-radius:18px;padding:10px 30px;box-shadow:0 5px 0 var(--gold-dk);border:3px solid #fff}
.undo{font-family:var(--f-display);font-size:18px;font-weight:600;background:#fff;border-radius:18px;padding:10px 16px;box-shadow:0 5px 0 rgba(0,0,0,.15)}
/* Coins + toast */
.coin{position:fixed;z-index:50;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF3B0,var(--gold) 55%,var(--gold-dk));border:2px solid #B87900;pointer-events:none;display:grid;place-items:center;color:#8A5A00;font:700 15px var(--f-display)}
.toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:40;font-family:var(--f-display);font-weight:700;font-size:42px;color:var(--green-dk);background:var(--paper);border:4px solid var(--green);border-radius:24px;padding:8px 26px;pointer-events:none;animation:toast 1.5s forwards;text-align:center;white-space:nowrap}
.toast small{display:block;font-size:19px;color:var(--purple-dk)}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%)}}
/* Shop */
.shop{align-items:center;text-align:center}
.shop h2{font-size:28px}
.price{font-size:18px;margin:0;display:flex;align-items:center;gap:8px;justify-content:center}
.price .coin{position:static;width:24px;height:24px;font-size:12px}
.buy{font-family:var(--f-display);font-size:26px;font-weight:700;background:var(--gold);border-radius:22px;padding:14px 34px;box-shadow:0 6px 0 var(--gold-dk);color:var(--ink);border:3px solid #fff}
.buy:disabled{background:#E8E1D3;box-shadow:0 6px 0 #CBBFA8;color:#8C8470}
.hint{margin:0;color:var(--ink-soft);max-width:34ch}
.linkb{font-family:var(--f-display);font-size:19px;font-weight:600;color:var(--wood);text-decoration:underline;text-underline-offset:4px}
.cardback{width:min(62vw,220px);aspect-ratio:5/7;border-radius:20px;border:6px solid #fff;box-shadow:0 8px 20px rgba(29,43,83,.25);background:radial-gradient(circle at 50% 50%,var(--gold) 0 22%,transparent 23%),repeating-conic-gradient(from 0deg at 50% 50%,#2F8E8A 0 15deg,#24716E 15deg 30deg);display:grid;place-items:center;max-width:100%}
.cardback span{font-family:var(--f-display);font-size:64px;font-weight:700;color:#7A4C00}
.wiggle{animation:wig 2.4s ease-in-out infinite}
@keyframes wig{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
/* Cards */
.card{--frame:#9DB4C0;width:min(84vw,330px);max-width:100%;border-radius:20px;padding:8px;background:var(--frame);box-shadow:0 8px 22px rgba(29,43,83,.25);position:relative;overflow:hidden;text-align:left}
.card.r-r{--frame:#3B8EEA}.card.r-s{--frame:#8E5CF6}
.card.r-b{background:linear-gradient(135deg,#FFD56B,#FF8FAB,#7BD3EA,#A1EEBD,#FFD56B);background-size:300% 300%;animation:holo 5s linear infinite}
.card-in{background:#fff;border-radius:14px;padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px;position:relative;z-index:1}
.c-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.c-name{font-family:var(--f-display);font-size:24px;font-weight:700;line-height:1.1}
.c-num{font-size:14px;color:var(--ink-soft);font-variant-numeric:tabular-nums;font-weight:700}
.c-art{background:#1B2238;border-radius:12px;aspect-ratio:4/3;display:grid;place-items:center;overflow:hidden;position:relative}
.c-art svg{width:78%;height:100%}
.c-rar{font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);display:flex;justify-content:space-between}
.c-rar .st{color:var(--gold-dk);letter-spacing:.1em}
.c-stats{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:13px;font-weight:700;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.c-stats .el{background:var(--eb);color:var(--e);padding:2px 10px;border-radius:99px;letter-spacing:.04em}
.c-desc{margin:0;font-size:15px;line-height:1.45}
.c-story{background:#FBF3E4;border-radius:10px;padding:8px 10px;font-size:14px;line-height:1.45}
.c-story b{font-family:var(--f-display);font-size:15px;display:block;color:var(--wood)}
.c-story p{margin:2px 0 0}

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const app=$('#app'),modal=$('#modal');
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);

/* ---------- Sauvegarde ---------- */
const KEY='bestioles-savantes-v1';
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&typeof s==='object')return s}catch(e){}return null}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function fresh(){return{coins:0,owned:[1],name:'Noah',avatar:'🦊',stars:0,casse:'maj',lv:{}}}
let S=load()||fresh();
function normalize(){
  const d=fresh();for(const k in d)if(S[k]===undefined)S[k]=d[k];
  if(!Array.isArray(S.owned)||!S.owned.length)S.owned=[1];
  const o=S.lv||{};S.lv={animaux:o.animaux||1,lettres:o.lettres||o.son||1,maths:o.maths||o.num||1,formes:o.formes||1,defis:o.defis||o.robot||1,labo:o.labo||1,village:o.village||1,espagnol:o.espagnol||1};
}
normalize();save();
/* ---------- Voix ---------- */
let voiceOK=null,frVoice=null,vbDismissed=false;
const hasTTS=()=>typeof window.speechSynthesis!=='undefined'&&typeof window.SpeechSynthesisUtterance!=='undefined';
function pickVoice(){try{const vs=speechSynthesis.getVoices();frVoice=vs.find(v=>/^fr[-_]FR/i.test(v.lang))||vs.find(v=>/^fr/i.test(v.lang))||null;esVoice=vs.find(v=>/^es[-_]ES/i.test(v.lang))||vs.find(v=>/^es/i.test(v.lang))||null}catch(e){}}
if(hasTTS()){pickVoice();try{speechSynthesis.addEventListener('voiceschanged',pickVoice)}catch(e){try{speechSynthesis.onvoiceschanged=pickVoice}catch(_){}}}
let spkTok=0,esVoice=null;
const UTT=[];let unlockU=null;
function say1(t,lang,rate,done){
  let fired=false;const fin=()=>{if(fired)return;fired=true;done()};
  const est=Math.max(1400,String(t).length*80);
  if(!t){setTimeout(fin,50);return}
  if(!hasTTS()){voiceFail();setTimeout(fin,Math.min(est,2500));return}
  try{
    const s=speechSynthesis;
    if(!frVoice||!esVoice)pickVoice();
    const es=lang.startsWith('es'),u=new SpeechSynthesisUtterance(t);u.lang=lang;u.rate=rate||(es?.82:.9);u.pitch=1;u.volume=1;
    const v=es?esVoice:frVoice;if(v&&!IOS)u.voice=v;else if(v&&IOS&&v.localService!==false)u.voice=v;
    UTT.push(u);if(UTT.length>20)UTT.shift();
    let started=false;
    u.onstart=()=>{started=true;voiceOK=true;hideVB();hideSoundGate()};
    u.onend=fin;
    u.onerror=e=>{if(!(e&&(e.error==='interrupted'||e.error==='canceled')))voiceFail();fin()};
    const go=()=>{try{s.speak(u);if(s.paused)s.resume()}catch(e){voiceFail();fin()}};
    const busy=(s.speaking||s.pending)&&!unlockU;
    if(busy){s.cancel();setTimeout(go,IOS?250:90)}else go();
    setTimeout(()=>{if(!started){if(voiceOK!==true)voiceFail();setTimeout(fin,600)}},IOS?4500:3200);
    setTimeout(fin,est/(u.rate||1)+6000);
  }catch(e){voiceFail();setTimeout(fin,1500)}
}
function speak(t,done,lang){
  const tok=++spkTok,parts=Array.isArray(t)?t:[[t,lang||'fr-FR']];let i=0,ended=false;
  const end=()=>{if(ended)return;ended=true;if(done)done()};
  const nx=()=>{if(tok!==spkTok||i>=parts.length)return end();const p=parts[i++];say1(String(p[0]||''),p[1]||'fr-FR',p[2],nx)};
  nx();
}

function rng(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shade(hex,p){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const f=v=>p<0?v*(1+p):v+(255-v)*p;const c=v=>Math.max(0,Math.min(255,Math.round(f(v)))).toString(16).padStart(2,'0');return'#'+c(r)+c(g)+c(b)}
function starPath(x,y,R,n=5,inner=.45){let d='';for(let i=0;i<n*2;i++){const a=-Math.PI/2+i*Math.PI/n,rr=i%2?R*inner:R;d+=(i?'L':'M')+(x+rr*Math.cos(a)).toFixed(1)+' '+(y+rr*Math.sin(a)).toFixed(1)}return d+'Z'}

    g=sky(kind)+`<circle cx="335" cy="52" r="22" fill="#FFE07A"/>`+cloud(90,48,1)+cloud(250,34,.8)+mountains()+
      `<path d="M0 205 Q100 170 200 200 T400 190 V300 H0Z" fill="#86C55E"/><ellipse cx="215" cy="228" rx="130" ry="20" fill="#5DB9E3"/><ellipse cx="200" cy="224" rx="70" ry="4" fill="#BDE8F7"/><path d="M0 245 Q120 225 240 250 T400 240 V300H0Z" fill="#5FA945"/>`;

function updateHead(){$('#coinCount').textContent=S.coins;$('#pname').textContent=S.name;$('#ava').textContent=S.avatar;$('#pstars').textContent=S.stars}
function flyCoins(fromEl,n,val){
  const a=fromEl.getBoundingClientRect(),b=$('#chest').getBoundingClientRect();
  const sx=a.left+a.width/2-15,sy=a.top+a.height/2-15,tx=b.left+24-15,ty=b.top+b.height/2-15;
  for(let i=0;i<n;i++){
    const c=document.createElement('div');c.className='coin';c.textContent='★';c.style.left=sx+'px';c.style.top=sy+'px';document.body.appendChild(c);
    const dx=tx-sx,dy=ty-sy,ox=rnd(-60,60);
    const fin=()=>{c.remove();S.coins+=val;updateHead();const ch=$('#chest');ch.classList.remove('bump');void ch.offsetWidth;ch.classList.add('bump');if(i===n-1)save()};
    try{const an=c.animate([{transform:'translate(0,0) scale(1)'},{transform:`translate(${dx*.4+ox}px,${dy*.4-70}px) scale(1.3)`},{transform:`translate(${dx}px,${dy}px) scale(.7)`}],{duration:800,delay:i*120,easing:'ease-in',fill:'forwards'});an.onfinish=fin}catch(e){fin()}
  }
}

const DIRS={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]},ARROW={up:0,right:90,down:180,left:270};
const arrowSVG=d=>`<svg viewBox="0 0 24 24" style="transform:rotate(${ARROW[d]}deg)" aria-hidden="true"><path d="M12 3l8 9h-5v9H9v-9H4z" fill="currentColor"/></svg>`;
const DIRNAME={up:'en haut',down:'en bas',left:'à gauche',right:'à droite'};
const HEROS=[['🦊','le renard','🕳️','son terrier'],['🐿️','l’écureuil','🌰','sa noisette'],['🐰','le lapin','🥕','sa carotte'],['🐻','l’ours','🍯','son miel'],['🦔','le hérisson','🍎','sa pomme'],['🐧','le manchot','🐟','son poisson']];
function bfs(n,rocks,a,b){const seen=new Set([a+'']),q=[[a,0]];while(q.length){const[[x,y],d]=q.shift();if(x===b[0]&&y===b[1])return d;for(const v of Object.values(DIRS)){const nx=x+v[0],ny=y+v[1],k=nx+','+ny;if(nx<0||ny<0||nx>=n||ny>=n||rocks.has(k)||seen.has(k))continue;seen.add(k);q.push([[nx,ny],d+1])}}return -1}
GEN.map=()=>{
  const L=lv(),cfg=[[3,1,2,0],[4,2,3,0],[4,3,4,2],[5,4,6,4]][L-1],n=cfg[0],H=pick(HEROS);
  let R,Z,rocks,tries=0;
  while(true){tries++;R=[rnd(0,n-1),rnd(0,n-1)];Z=[rnd(0,n-1),rnd(0,n-1)];const d=Math.abs(R[0]-Z[0])+Math.abs(R[1]-Z[1]);if(d<cfg[1]||d>cfg[2])continue;rocks=new Set();let g=0;while(rocks.size<cfg[3]&&g++<50){const p=[rnd(0,n-1),rnd(0,n-1)],k=p+'';if(k!==R+''&&k!==Z+'')rocks.add(k)}const s=bfs(n,rocks,R,Z);if(s>0&&s<=d+2)break;if(tries>300){rocks=new Set();break}}
  let cells='';const obs=['🌳','🪨'];
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){const k=x+','+y,isZ=x===Z[0]&&y===Z[1];cells+=`<div class="cell${isZ?' goal':''}">${isZ?H[2]:rocks.has(k)?obs[(x+y)%2]:''}</div>`}
  bubble(`Mission : aide <b>${H[1]}</b> à retrouver ${H[3]} !`,`Mission : aide ${H[1]} à retrouver ${H[3]}. ${L>=3?'Attention aux obstacles ! ':''}Appuie sur les flèches, puis sur Go.`);
  const body=$('#body');
  body.insertAdjacentHTML('beforeend',`<div class="board" style="--n:${n}"><div class="cells">${cells}</div><div class="robot" id="robot">${H[0]}</div></div><div class="progline" id="pl"></div><div class="pad">${Object.keys(ARROW).map(d=>`<button class="${d}" data-d="${d}" aria-label="${DIRNAME[d]}">${arrowSVG(d)}</button>`).join('')}</div><div class="runrow"><button class="undo" id="undo">Effacer</button><button class="go" id="go">Go !</button></div>`);
  const seq=[],robot=$('#robot'),pl=$('#pl');let pos=R.slice(),running=false;
  const place=()=>{robot.style.transform=`translate(${pos[0]*100}%,${pos[1]*100}%)`};place();
  const draw=now=>{pl.innerHTML=seq.length?seq.map((d,i)=>`<span class="ar${i===now?' now':''}">${arrowSVG(d)}</span>`).join(''):'<span class="ph">Tes flèches apparaissent ici</span>'};draw();
  const ctrls=()=>body.querySelectorAll('.pad button,.runrow button');
  body.querySelectorAll('.pad button').forEach(b=>b.onclick=()=>{if(running||cur.locked||seq.length>=10)return;seq.push(b.dataset.d);draw();speak(DIRNAME[b.dataset.d])});
  $('#undo').onclick=()=>{if(running)return;seq.pop();draw()};
  $('#go').onclick=()=>{
    if(running||cur.locked)return;if(!seq.length){speak('Choisis d’abord des flèches !');return}
    running=true;ctrls().forEach(b=>b.disabled=true);let i=0;
    const fail=m=>{robot.classList.add('bonk');lose(m);setTimeout(()=>{robot.classList.remove('bonk');pos=R.slice();place();seq.length=0;draw();running=false;ctrls().forEach(b=>b.disabled=false)},1400)};
    const step=()=>{
      if(!cur||cur.u!=='defis')return;
      if(i>=seq.length){if(pos[0]===Z[0]&&pos[1]===Z[1]){draw();win(robot,`${cap(H[1])} a retrouvé ${H[3]} !`)}else fail(`Oups, ${H[1]} n’est pas arrivé. Essaie encore !`);return}
      const v=DIRS[seq[i]],nx=pos[0]+v[0],ny=pos[1]+v[1];draw(i);
      if(nx<0||ny<0||nx>=n||ny>=n){fail('Oh là, il sort de la carte ! Essaie encore.');return}
      if(rocks.has(nx+','+ny)){fail('Bong ! Il y a un obstacle. Essaie encore.');return}
      pos=[nx,ny];place();i++;setTimeout(step,480);
    };step();
  };
};

const RECENT={};
function frsh(key,arr,keep){keep=keep===undefined?Math.min(5,Math.floor(arr.length/2)):keep;const r=RECENT[key]||(RECENT[key]=[]);let pool=arr.filter(x=>!r.includes(x));if(!pool.length)pool=arr;const v=pick(pool);r.push(v);while(r.length>keep)r.shift();return v}

/* ---------- Glisser-déposer ---------- */
function dragify(el,onDrop,onTap){
  el.style.touchAction='none';
  el.onclick=e=>{if(e.detail===0&&onTap)onTap(el)};
  el.addEventListener('pointerdown',e=>{
    if((cur&&cur.locked)||el.disabled||e.button>0)return;
    const r=el.getBoundingClientRect(),sx=e.clientX,sy=e.clientY;let ghost=null,over=null;
    const mv=ev=>{const dx=ev.clientX-sx,dy=ev.clientY-sy;
      if(!ghost){if(Math.hypot(dx,dy)<8)return;ghost=el.cloneNode(true);ghost.classList.add('ghost');Object.assign(ghost.style,{position:'fixed',left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px',zIndex:60,pointerEvents:'none',margin:'0'});document.body.appendChild(ghost);el.classList.add('dragging')}
      ghost.style.transform=`translate(${dx}px,${dy}px) scale(1.08)`;
      const t=document.elementFromPoint(ev.clientX,ev.clientY),d=t&&t.closest?t.closest('[data-drop]'):null;
      if(d!==over){if(over)over.classList.remove('over');over=d;if(d)d.classList.add('over')}
      ev.preventDefault()};
    const up=ev=>{document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);document.removeEventListener('pointercancel',up);if(over)over.classList.remove('over');
      if(ghost){ghost.remove();el.classList.remove('dragging');onDrop(over,el)}else if(ev.type==='pointerup'&&onTap)onTap(el)};
    document.addEventListener('pointermove',mv,{passive:false});document.addEventListener('pointerup',up);document.addEventListener('pointercancel',up);
  });
}

GEN.memoMoves=()=>{
  const L=lv(),n=L<=2?4:5,k=[2,3,3,4][L-1]+(L===4&&Math.random()<.5?1:0),start=[Math.floor(n/2),Math.floor(n/2)];
  const seq=[];let p=start.slice();while(seq.length<k){const d=pick(Object.keys(DIRS)),v=DIRS[d],q=[p[0]+v[0],p[1]+v[1]];if(q[0]<0||q[1]<0||q[0]>=n||q[1]>=n)continue;seq.push(d);p=q}
  bubble(`Regarde bien les <b>${k} déplacements</b> du dragon, puis refais-les !`,`Regarde bien le dragon. Il va faire ${k} déplacements. Ensuite, refais les mêmes avec les flèches.`);
  const body=B();
  body.insertAdjacentHTML('beforeend',`<div class="board" style="--n:${n}"><div class="cells">${Array.from({length:n*n},()=>'<div class="cell"></div>').join('')}</div><div class="robot" id="robot">🐉</div></div><div class="progline" id="pl"></div><div class="pad">${Object.keys(ARROW).map(d=>`<button class="${d}" data-d="${d}" aria-label="${DIRNAME[d]}">${arrowSVG(d)}</button>`).join('')}</div><button class="undo" id="again">👀 Revoir</button>`);
  const robot=$('#robot'),pl=$('#pl'),btns=body.querySelectorAll('.pad button');let pos=start.slice(),i=0,demo=true;
  const place=()=>{robot.style.transform=`translate(${pos[0]*100}%,${pos[1]*100}%)`};
  const strip=(show,upto)=>{pl.innerHTML=seq.map((d,j)=>`<span class="ar${j<upto?'':' hide'}">${show||j<upto?arrowSVG(d):'?'}</span>`).join('')};
  const play=()=>{demo=true;btns.forEach(b=>b.disabled=true);pos=start.slice();place();i=0;strip(false,0);let j=0;
    const st=()=>{if(!cur||!document.body.contains(robot))return;if(j<seq.length){const v=DIRS[seq[j]];pos=[pos[0]+v[0],pos[1]+v[1]];place();strip(false,j+1);speak(DIRNAME[seq[j]]);j++;setTimeout(st,900)}else setTimeout(()=>{pos=start.slice();place();strip(false,0);demo=false;btns.forEach(b=>b.disabled=false);speak('À toi ! Refais les mêmes déplacements.')},900)};
    setTimeout(st,1200)};
  btns.forEach(b=>b.onclick=()=>{if(demo||cur.locked)return;const d=b.dataset.d;
    if(d===seq[i]){const v=DIRS[d];pos=[pos[0]+v[0],pos[1]+v[1]];place();i++;strip(false,i);if(i===seq.length)win(robot,'Tu as bien mémorisé tous les déplacements !')}
    else{robot.classList.add('bonk');setTimeout(()=>robot.classList.remove('bonk'),400);lose('Ce n’était pas ce déplacement. Regarde encore une fois !');setTimeout(play,1200)}});
  $('#again').onclick=()=>{if(!demo&&!cur.locked)play()};
  place();strip(false,0);play();
};

/* ---------- Boutique ---------- */
const WEIGHTS={c:60,r:27,s:9,b:4};
function drawCard(){
  const left=CARDS.filter(c=>!S.owned.includes(c.id));if(!left.length)return null;
  let roll=Math.random()*100,tier='c';for(const[k,w]of Object.entries(WEIGHTS)){if(roll<w){tier=k;break}roll-=w}
  let pool=left.filter(c=>c.tier===tier);if(!pool.length)for(const k of['c','r','s','b']){pool=left.filter(c=>c.tier===k);if(pool.length)break}
  return pick(pool);
}
function showShop(){
  closeModal();cur=null;
  const done=S.owned.length>=151,miss=50-S.coins;
  app.innerHTML=`<div class="wrap shop"><button class="back" data-home style="align-self:flex-start">‹ Accueil</button><h2>La boutique</h2><div class="cardback wiggle"><span>?</span></div>
  <p class="price"><span class="coin">★</span> 50 pièces = 1 carte surprise</p>
  <button class="buy" id="buy" ${S.coins<50||done?'disabled':''}>Acheter une carte</button>
  <p class="hint">${done?'Bravo, ton carnet est complet ! Tu as trouvé les 151 animaux.':miss>0?`Encore ${miss} pièces à gagner. Chaque bonne réponse remplit ton coffre de 5 pièces.`:`Tu as de quoi acheter ${Math.floor(S.coins/50)} carte${S.coins>=100?'s':''}.`}</p>
  <button class="linkb" id="toAlbum">Voir mon carnet (${S.owned.length}/151)</button></div>`;
  app.querySelector('[data-home]').onclick=showHome;$('#buy').onclick=buy;$('#toAlbum').onclick=showAlbum;app.scrollTop=0;
  if(S.coins<50&&!done)speak(`Il te manque ${miss} pièces pour acheter une carte.`);
}
function buy(){
  if(S.coins<50)return;const c=drawCard();if(!c)return;
  S.coins-=50;S.owned.push(c.id);save();updateHead();
  modal.innerHTML=`<div class="mbox"><div class="mtitle">Nouvelle carte !</div><div class="flip" id="flip"><div class="flip-in"><div class="back"><div class="cardback"><span>?</span></div></div><div class="front">${cardHTML(c)}</div></div></div><div class="mrow">${S.coins>=50?'<button class="mbtn gold" id="again">Encore une !</button>':''}<button class="mbtn" id="toA">Mon carnet</button><button class="mbtn" id="toH">Jouer</button></div></div>`;
  modal.hidden=false;
  setTimeout(()=>{const f=$('#flip');if(f)f.classList.add('open');speak(`Nouvelle carte ${TIERS[c.tier].label} ! Voici : ${c.name}. ${c.desc} Le savais-tu ? ${c.fact}`)},700);
  const ag=$('#again');if(ag)ag.onclick=()=>{closeModal();buy()};
  $('#toA').onclick=showAlbum;$('#toH').onclick=showHome;
  const b=$('#buy');if(b)b.disabled=S.coins<50;
}

/* ---------- Carnet ---------- */
function showAlbum(){
  closeModal();cur=null;
  const n=S.owned.length,own=new Set(S.owned);
  let cells='';CARDS.forEach(c=>{const num=String(c.id).padStart(3,'0');cells+=own.has(c.id)?`<button class="acell own r-${c.tier}" style="${artBg(c)}" data-id="${c.id}" aria-label="${c.name}"><span class="anum">${num}</span>${creature(c)}</button>`:`<div class="acell"><span class="anum">${num}</span><span class="qm">?</span></div>`});
  app.innerHTML=`<div class="wrap"><button class="back" data-home style="align-self:flex-start">‹ Accueil</button><div class="ahead"><h2>Carnet d’explorateur</h2><span class="count">${n} / 151</span></div><div class="bar"><i style="width:${(n/151*100).toFixed(1)}%"></i></div>
  <div class="legend"><span style="--c:#9DB4C0">Commune</span><span style="--c:#3B8EEA">Rare</span><span style="--c:#8E5CF6">Super rare</span><span style="--c:#FFC93C">Brillante</span></div>
  <div class="grid">${cells}</div></div>`;
  app.querySelector('[data-home]').onclick=showHome;
  app.querySelectorAll('.acell.own').forEach(b=>b.onclick=()=>{const c=CARDS[b.dataset.id-1];modal.innerHTML=`<div class="mbox">${cardHTML(c)}<div class="mrow"><button class="mbtn" id="rd">Lire</button><button class="mbtn gold" id="cl">Fermer</button></div></div>`;modal.hidden=false;$('#cl').onclick=closeModal;$('#rd').onclick=()=>speak(`${c.name}. ${c.desc} Le savais-tu ? ${c.fact}`)});
  app.scrollTop=0;
}

/* ---------- Réglages parents ---------- */
const AVAS=['🦊','🐻','🐰','🦉','🐼','🦁','🐯','🐸'];
function settings(){
  modal.innerHTML=`<div class="panel"><h2>Réglages parents</h2>
  <label for="nm">Prénom de l’enfant</label><input id="nm" maxlength="16" autocomplete="off" value="${esc(S.name)}">
  <span class="lab">Compagnon d’aventure</span><div class="avas">${AVAS.map(a=>`<button data-a="${a}" class="${a===S.avatar?'on':''}" aria-label="Compagnon ${a}">${a}</button>`).join('')}</div>
  <span class="lab">Niveaux par univers</span>
  <div class="ulist">${Object.entries(UNIV).map(([k,u])=>`<div class="urow ${u.cls}"><span class="udot">${u.ic}</span><span class="un">${u.t}<small>Niveau ${S.lv[k]} · ${(S.lvp&&S.lvp[k])||0}/${NEED}</small></span><button class="ureset" data-k="${k}">↺ Remettre à zéro</button></div>`).join('')}</div>
  <p>Remettre un univers à zéro le ramène au niveau 1. Les pièces et les cartes du carnet sont gardées. Un niveau monte après 8 bonnes réponses du premier coup et redescend après 3 erreurs de suite. La progression est gardée dans ce navigateur, sur cet appareil.</p>
  <p id="offl">Vérification du mode hors connexion…</p><button class="mbtn" id="inst" hidden>📲 Installer Casa de Noah</button><p id="vdiag"></p><button class="mbtn gold" id="tv">Tester la voix</button><button class="mbtn red" id="rz">Tout effacer (cartes et pièces comprises)</button><button class="mbtn" id="cl">Fermer</button></div>`;
  modal.hidden=false;
  $('#nm').oninput=e=>{S.name=e.target.value.trim()||'Noah';save();updateHead()};
  modal.querySelectorAll('.avas button').forEach(b=>b.onclick=()=>{S.avatar=b.dataset.a;save();updateHead();modal.querySelectorAll('.avas button').forEach(x=>x.classList.toggle('on',x===b))});
  {const vs=hasTTS()?speechSynthesis.getVoices():[];pickVoice();const dg=$('#vdiag');if(dg)dg.textContent=`Voix : ${hasTTS()?'disponible':'non disponible sur cet appareil'} · ${vs.length} voix · français : ${frVoice?frVoice.name:'aucune'} · espagnol : ${esVoice?esVoice.name:'aucune'}`}
  (async()=>{const o=$('#offl');if(!o)return;try{const k=await caches.keys();let ok=false;for(const n of k){const c=await caches.open(n);if(await c.match('index.html')||await c.match('./')){ok=true;break}}o.textContent=ok?'✓ Le jeu est enregistré sur ce téléphone : il marche sans connexion.':'Le jeu n’est pas encore enregistré pour le hors connexion. Garde la page ouverte quelques secondes avec Internet, puis recharge-la.'}catch(e){o.textContent='Mode hors connexion indisponible dans ce navigateur.'}})();
  {const ib=$('#inst');if(ib&&window.__inst){ib.hidden=false;ib.onclick=async()=>{const p=window.__inst;window.__inst=null;ib.hidden=true;try{p.prompt();await p.userChoice}catch(e){}}}}
  $('#tv').onclick=()=>{vbDismissed=false;speak(`Bonjour ${S.name} ! Je suis la voix de Casa de Noah.`)};
  $('#cl').onclick=()=>{closeModal();if(!cur)showHome()};
  modal.querySelectorAll('.ureset').forEach(b=>b.onclick=()=>{const k=b.dataset.k;
    if(!b.dataset.ok){b.dataset.ok='1';b.textContent='Confirmer ?';b.classList.add('conf');setTimeout(()=>{if(b.isConnected&&b.dataset.ok){delete b.dataset.ok;b.textContent='↺ Remettre à zéro';b.classList.remove('conf')}},4000);return}
    S.lv[k]=1;S.lvp=S.lvp||{};S.lvp[k]=0;if(prog[k]){prog[k].streak=0;prog[k].miss=0}if(S.mission&&S.mission.u===k&&!S.mission.done)S.mission.prog=0;save();
    const row=b.closest('.urow');row.querySelector('small').textContent=`Niveau 1 · 0/${NEED}`;delete b.dataset.ok;b.classList.remove('conf');b.textContent='✓ Remis à zéro';b.disabled=true;});
  $('#rz').onclick=()=>{const b=$('#rz');if(b.dataset.ok){const nm=S.name,av=S.avatar;S=fresh();S.name=nm;S.avatar=av;normalize();save();updateHead();showHome()}else{b.dataset.ok='1';b.textContent='Toucher encore pour confirmer'}};
}
function closeModal(){modal.hidden=true;modal.innerHTML=''}
modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});

$('#chest').onclick=showShop;$('#gear').onclick=settings;$('#profile').onclick=showAlbum;
updateHead();showHome();
setTimeout(soundGate,300);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();window.__inst=e});
window.addEventListener('appinstalled',()=>{window.__inst=null;toast('Casa de Noah est installée !')});
})();
</script>
